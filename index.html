    <meta name="twitter:description" content="Unity / Game Developer portfolio showcasing projects, systems, and experience." />
    <meta name="twitter:image" content="https://dwiwahyu.is-a.dev/assets/images/social-preview.png" />
    <meta name="twitter:image:alt" content="Dwi Wahyu Aji Kurniawan — Unity / Game Developer portfolio" />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI"
        crossorigin="anonymous" />
    <link rel="stylesheet" href="./css/main2.css" />

    <script src="https://cdn.jsdelivr.net/npm/marked@18.0.6/lib/marked.umd.js"
        integrity="sha384-uGn1eBC40GtuBgao0epc/cz9O4Lo8/flg/10SW+69UjLI5nP31iT4UPc65Xz10Le"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.min.js"
        integrity="sha384-a7SzOxErzJ3ZpQz0zJ32d67dSitNzPcbfybc/ykU9KJhMgZkwqfSxlhhdJRS+XGL"
        crossorigin="anonymous"></script>
    <script>
        let storedTheme = null;
        try {
            const value = localStorage.getItem("theme");
            if (["light", "dark"].includes(value)) storedTheme = value;
        } catch { /* Fall back to the system theme when storage is unavailable. */ }
        document.documentElement.classList.toggle("dark", storedTheme === "dark" ||
            (!storedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches));
    </script>
</head>

<body class="bg-white text-neutral-900 dark:bg-gray-900 dark:text-neutral-100 transition-colors duration-300">

    <!-- Dark mode toggle -->
    <div id="theme-toggle" class="fixed top-4 right-4 z-50 flex gap-2"></div>

    <main class="max-w-5xl mx-auto px-6 py-20 space-y-36">

        <noscript>
            <p>This portfolio requires JavaScript to load its content.</p>
        </noscript>

        <!-- Intro -->
        <section id="intro" class="space-y-6"></section>

        <!-- Projects -->
        <section id="projects">
            <h2 class="text-2xl font-semibold tracking-tight mb-10">Projects</h2>
            <div id="project-filters" role="group" aria-label="Filter projects by technology" class="mb-6 flex flex-wrap gap-2"></div>
            <div id="project-grid" tabindex="-1" class="grid gap-6 grid-cols-1 sm:grid-cols-2 md:grid-cols-3"></div>
        </section>

        <!-- Skills -->
        <section id="skills">
            <h2 class="text-2xl font-semibold tracking-tight mb-10">Skills</h2>
            <div id="skills-content" class="skills-section"></div>
        </section>

        <!-- Experience -->
        <section id="experience">
            <h2 class="text-2xl font-semibold tracking-tight mb-10">Experience</h2>
            <div id="experience-content" class="markdown prose dark:prose-invert"></div>
        </section>

        <!-- Certifications -->
        <section id="certifications">
            <h2 class="text-2xl font-semibold tracking-tight mb-10">Certifications</h2>
            <div id="certifications-content"></div>
        </section>
    </main>

    <!-- Modal -->
    <div id="modal-root" class="fixed inset-0 hidden z-50">
        <div id="modal-backdrop" class="absolute inset-0 bg-black/50"></div>
        <div id="modal-panel" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="modal-title"
            class="relative bg-white dark:bg-gray-800 w-full h-full md:h-auto md:max-w-3xl md:mx-auto md:my-16 rounded-none md:rounded-lg overflow-hidden flex flex-col transition-colors duration-300">
            <div
                class="flex justify-between items-center px-6 py-4 border-b border-neutral-200 dark:border-neutral-700">
                <h3 id="modal-title" class="text-lg font-semibold text-neutral-900 dark:text-neutral-100"></h3>
                <button id="modal-close" type="button" aria-label="Close project details"
                    class="text-xl leading-none text-neutral-900 dark:text-neutral-100">&times;</button>
            </div>
            <div id="modal-body" class="markdown px-6 py-6 overflow-y-auto prose dark:prose-invert"></div>
        </div>
    </div>

    <div id="toast" role="status" aria-live="polite" aria-atomic="true" class="pointer-events-none fixed bottom-6 right-6 z-50
            opacity-0 transition-all duration-200 translate-y-2">
    </div>

    <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/modal.js"></script>
</body>

</html>
